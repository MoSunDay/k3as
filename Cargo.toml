# init-pro — single multicall binary, k3s-compatible Kubernetes distro.
# See plans/init-pro/ for the SSOT.
[workspace]
resolver = "2"
# link_repos/* are separate upstream workspaces (openrusty / rdb /
# flannel-rust) consumed as path dependencies. Without the exclude, cargo
# resolves their `workspace.*` inheritance against THIS root and fails.
exclude = ["link_repos"]
members = [
    "crates/init-pro",
    "crates/common",
    "crates/multicall",
    "crates/cli",
    "crates/kubectl",
    "crates/kubelet",
    "crates/infra",
    "crates/vendor",
    "crates/api",
    "crates/agent",
    "crates/apiserver",
    "crates/controllers",
    "crates/scheduler",
    "crates/runtime",
    "crates/router",
    "crates/storage",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["init-pro"]
# TODO: set to the real git hosting URL before publishing.
repository = "https://github.com/init-pro/init-pro"
description = "A k3s-compatible Kubernetes distribution in one Rust multicall binary, with a built-in openrusty data plane (Q32)."
publish = false

[workspace.dependencies]
# Internal crates
common = { path = "crates/common" }
multicall = { path = "crates/multicall" }
cli = { path = "crates/cli" }
kubectl = { path = "crates/kubectl" }
kubelet = { path = "crates/kubelet" }
infra = { path = "crates/infra" }
vendor = { path = "crates/vendor" }
api = { path = "crates/api" }
apiserver = { path = "crates/apiserver" }
controllers = { path = "crates/controllers" }
scheduler = { path = "crates/scheduler" }
runtime = { path = "crates/runtime" }
router = { path = "crates/router" }
storage = { path = "crates/storage" }

# Embedded upstream Rust components (link_repos/* symlinks; see decisions.md).
# - openrusty: the h2c gateway engine behind the Router data plane (T5.x rewrite).
openrusty-core = { path = "link_repos/openrusty/crates/openrusty-core" }
openrusty-server = { path = "link_repos/openrusty/crates/openrusty-server" }
# - rdb: RocksDB store engine behind the durable datastore (T2.3 rewrite).
#   `store`-only feature keeps openraft/sqlparser/jieba out of the build.
rdb = { path = "link_repos/rdb", default-features = false, features = ["store"] }
# - flannel-rust: kube subnet-mgr flanneld + the flannel CNI meta-plugin (T4.3).
flanneld = { path = "link_repos/flannel-rust/crates/flanneld" }
flannel-cni = { path = "link_repos/flannel-rust/crates/flannel-cni" }
# - opencoder: the Agent engine behind init-pro.io/Agent (T7.1 rewrite, Q35).
#   Minimal closure is core+session; `session` transitively pulls llm+store
#   (and libsql) inside the upstream opencoder workspace — same build-cost
#   class as rdb/RocksDB, accepted. Only core+session are declared here
#   (root [workspace] excludes link_repos, so the upstream crates resolve
#   their own `workspace = true` refs against their own workspace).
opencoder-core = { path = "link_repos/opencoder/crates/core" }
opencoder-session = { path = "link_repos/opencoder/crates/session" }
# - anyhome: mountable NFSv3 memory service behind workflow/agent workspaces
#   (T-anyhome, decision Q36). Default features only — the real semantic
#   embedder (`embed-fastembed`) stays off, like rdb's `store`-only cut.
anyhome = { path = "link_repos/any-home/crates/anyhome" }
nfsserve = { path = "link_repos/any-home/link_repos/nfsserve" }

# External
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env", "help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML manifest parsing for `kubectl apply` (T7.3 Scope A, Q30). Caret-only
# like every external dep.
serde_yaml_ng = "0.10"
thiserror = "2"
# Layer 1 resource model (T1.1). JSON-only for v1 (Q10).
kube-core = { version = "4.2", default-features = false, features = ["json-patch"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
json-patch = "4"
sha2 = "0.10"
zstd = "0.13"
# HTTP framework (T1.2). axum is built on hyper/tokio/tower and is shared by
# both the apiserver (T1.2) and the Router data plane (T5.2 "hyper body streaming").
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
tower = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "sync", "process", "net"] }
# Stream wrappers (watch body streaming, T1.2b).
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Build profile: small, fast binaries (single-binary constraint, Q1).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
