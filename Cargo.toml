# init-pro — single multicall binary, k3s-compatible Kubernetes distro.
# See plans/init-pro/ for the SSOT.
[workspace]
resolver = "2"
members = [
    "crates/init-pro",
    "crates/init-pro-core",
    "crates/init-pro-multicall",
    "crates/init-pro-cli",
    "crates/init-pro-infra",
    "crates/init-pro-vendor",
    "crates/init-pro-api",
    "crates/init-pro-apiserver",
    "crates/init-pro-router",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["init-pro"]
repository = "https://example.invalid/init-pro"
publish = false

[workspace.dependencies]
# Internal crates
init-pro-core = { path = "crates/init-pro-core" }
init-pro-multicall = { path = "crates/init-pro-multicall" }
init-pro-cli = { path = "crates/init-pro-cli" }
init-pro-infra = { path = "crates/init-pro-infra" }
init-pro-vendor = { path = "crates/init-pro-vendor" }
init-pro-api = { path = "crates/init-pro-api" }
init-pro-apiserver = { path = "crates/init-pro-apiserver" }
init-pro-router = { path = "crates/init-pro-router" }

# External
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Layer 1 resource model (T1.1). JSON-only for v1 (Q10).
kube-core = { version = "4.2", default-features = false, features = ["json-patch"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
json-patch = "4"
sha2 = "0.10"
zstd = "0.13"
# HTTP framework (T1.2). axum is built on hyper/tokio/tower and is shared by
# both the apiserver (T1.2) and the Router data plane (T5.2 "hyper body streaming").
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "macros"] }
tower = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "sync", "process", "net"] }
# Lua VM for the built-in Router (T5.1). LuaJIT via vendored luajit-src; `async` enables coroutine<->Rust-future bridging; `error-send` makes the
# error type Send. `luajit52` is OFF (openresty = LuaJIT 2.1 = Lua 5.1).
mlua = { version = "0.12", features = ["luajit", "vendored", "async", "error-send"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Build profile: small, fast binaries (single-binary constraint, Q1).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
