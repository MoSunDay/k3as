# init-pro — single multicall binary, k3s-compatible Kubernetes distro.
# See plans/init-pro/ for the SSOT.
[workspace]
resolver = "2"
members = [
    "crates/init-pro",
    "crates/common",
    "crates/multicall",
    "crates/cli",
    "crates/kubectl",
    "crates/kubelet",
    "crates/infra",
    "crates/vendor",
    "crates/api",
    "crates/apiserver",
    "crates/controllers",
    "crates/scheduler",
    "crates/runtime",
    "crates/router",
    "crates/storage",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["init-pro"]
# TODO: set to the real git hosting URL before publishing.
repository = "https://github.com/init-pro/init-pro"
description = "A k3s-compatible Kubernetes distribution in one Rust multicall binary, with a built-in Lua data plane."
publish = false

[workspace.dependencies]
# Internal crates
common = { path = "crates/common" }
multicall = { path = "crates/multicall" }
cli = { path = "crates/cli" }
kubectl = { path = "crates/kubectl" }
kubelet = { path = "crates/kubelet" }
infra = { path = "crates/infra" }
vendor = { path = "crates/vendor" }
api = { path = "crates/api" }
apiserver = { path = "crates/apiserver" }
controllers = { path = "crates/controllers" }
scheduler = { path = "crates/scheduler" }
runtime = { path = "crates/runtime" }
router = { path = "crates/router" }
storage = { path = "crates/storage" }

# External
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env", "help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Layer 1 resource model (T1.1). JSON-only for v1 (Q10).
kube-core = { version = "4.2", default-features = false, features = ["json-patch"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
json-patch = "4"
sha2 = "0.10"
zstd = "0.13"
# HTTP framework (T1.2). axum is built on hyper/tokio/tower and is shared by
# both the apiserver (T1.2) and the Router data plane (T5.2 "hyper body streaming").
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
tower = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "sync", "process", "net"] }
# Stream wrappers (watch body streaming, T1.2b).
tokio-stream = "0.1"
# Lua VM for the built-in Router (T5.1). LuaJIT via vendored luajit-src; `async` enables coroutine<->Rust-future bridging; `error-send` makes the
# error type Send. `luajit52` is OFF (openresty = LuaJIT 2.1 = Lua 5.1).
mlua = { version = "0.12", features = ["luajit", "vendored", "async", "error-send"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Build profile: small, fast binaries (single-binary constraint, Q1).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
