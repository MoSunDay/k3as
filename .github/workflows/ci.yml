# init-pro CI. The canonical gates (plans/init-pro/README.md):
#   cargo build --workspace --locked
#   cargo test  --workspace --locked
#   cargo clippy --workspace --all-targets -- -D warnings
# plus the e2e acceptance scripts under scripts/ (which run a PRE-BUILT binary).
#
# `--locked` is mandatory so CI never silently picks up new dep patch versions
# (deps are caret-only; the lock file is the contract).
name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # build.rs: no network, empty embed registry -> fast, deterministic builds.
  INIT_PRO_VENDOR: "0"
  INIT_PRO_EMBED: "0"

jobs:
  lint-test:
    name: fmt + clippy + test + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fmt BEFORE bootstrap: `cargo fmt --all` also walks materialized
      # path-dep trees once link_repos exists (foreign code, formatted by
      # their own toolchains); with link_repos absent it scopes to this
      # workspace only.
      - name: cargo fmt (workspace only)
        run: cargo fmt --all --check

      - name: Materialize pinned link_repos path deps (T0.2b, Q38)
        run: scripts/bootstrap-link-repos.sh

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Build binary (debug)
        run: cargo build --workspace --locked

      - name: Install curl (e2e dependency)
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: e2e — multicall + CLI parity + graceful shutdown
        run: |
          scripts/multicall-selftest.sh
          scripts/cli-flag-parity-test.sh
          scripts/graceful-shutdown-test.sh

      - name: e2e — service traffic (NodePort over the openrusty plane, Q32)
        run: scripts/service-traffic-e2e.sh

      - name: e2e — discovery parity + golden conformance (T0.6)
        run: |
          scripts/apiserver-discovery-parity-test.sh
          scripts/golden-conformance.sh

      - name: e2e — durability across restart (T2.3, Q33)
        run: scripts/durability-e2e.sh

  bundle:
    name: INIT_PRO_EMBED=1 build + stage test
    runs-on: ubuntu-latest
    env:
      # Acquire pinned upstream peers (containerd/runc/cni) and bake them into
      # the binary so the stage() acceptance harness has something to extract.
      INIT_PRO_VENDOR: "1"
      INIT_PRO_EMBED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Materialize pinned link_repos path deps (T0.2b, Q38)
        run: scripts/bootstrap-link-repos.sh

      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # NOTE: this job needs network twice — the bootstrap clones above and
      # the EMBED=1 vendor downloads (INIT_PRO_VENDOR=1) during build.rs.
      - name: Build with embedded assets
        run: cargo build -p init-pro --locked
      - name: e2e — stage fresh-dir (T0.2 B6)
        run: scripts/stage-fresh-dir-test.sh
