# link_repos.lock — pinned path-dependency manifest (T0.2b, Q38).
#
# `link_repos/` is gitignored BY DESIGN: these are read-only build inputs,
# materialized reproducibly by `scripts/bootstrap-link-repos.sh`
# (git clone + `git checkout <sha>`). Never commit materialized trees.
#
# Rules:
#   * Entries materialize IN LISTED ORDER — any-home precedes libsql, the
#     one repo still pinned INSIDE the any-home tree. nfsserve is pinned
#     TOP-LEVEL (default path link_repos/nfsserve); its AUTH_SYS
#     caller-identity patch (Q37) is versioned in THIS repo at
#     scripts/patches/ so the patch advances with its consumer
#     commit-by-commit instead of riding the any-home pin.
#   * `path` is repo-root relative; default `link_repos/<name>`.
#   * `patch` (optional) is applied on top of the pinned checkout,
#     idempotently (`patch_marker` file presence = already applied).
#   * `also_link` (optional, string array) lists extra repo-root paths that
#     must resolve to this repo's MAIN target as RELATIVE symlinks. Needed
#     when an upstream workspace references a pin through its own internal
#     relative path: any-home's Cargo.toml resolves nfsserve at
#     link_repos/nfsserve relative to the any-home root, so that path must
#     stay a symlink to the top-level checkout — otherwise the dependency
#     graph holds two divergent nfsserve copies. The root Cargo.toml
#     references that same nested path on purpose: cargo keys path deps by
#     LEXICAL path (symlinks are never canonicalized), so keeping one
#     lexical identity is what holds nfsserve to a single lockfile entry.
#   * The real directories link_repos/argo-workflows/ and link_repos/flannel/
#     are REFERENCE CHECKOUTS ONLY (docs / e2e inspiration) — no Cargo.toml
#     path dependency points at them; bootstrap ignores them.
#   * Reachability notes: all MoSunDay/* pins except rdb are origin/main
#     tips. rdb's validated line (8de5dcc) was rewritten out of upstream
#     main (d52ef49 is a parallel rebase), so the pin is published as the
#     dedicated branch `pin/init-pro` on MoSunDay/rdb — full clone +
#     checkout reaches it. libsql/nfsserve pins are ancestors of (resp.
#     tip of) their public upstreams. any-home was RE-PINNED to the
#     reachable main tip 42b8d8e after upstream rewrote history (the old
#     a1e2d9c line became unreachable; Q42 session, rdb precedent).
#     arust-workflow (Q42) is the workflow engine+model extraction —
#     origin/main tip, consumed as workspace path deps by crates/api
#     and crates/controllers.

[[repo]]
name = "openrusty"
url  = "https://github.com/MoSunDay/openrusty.git"
sha  = "4180ad39832c911b16297d6083823bde5903d60c"

[[repo]]
name = "rdb"
url  = "https://github.com/MoSunDay/rdb.git"
sha  = "8de5dccd8de5796dde180b2fabf267f91ad455a7"

[[repo]]
name = "flannel-rust"
url  = "https://github.com/MoSunDay/flannel-rust.git"
sha  = "76397b51f51fdb2e6c6082be9797b2cf87e9a288"

[[repo]]
name = "opencoder"
url  = "https://github.com/MoSunDay/opencoder.git"
sha  = "c1a1b2e78e1ccd4a3cc2ac6dc408a76d30bf46e6"

[[repo]]
name = "any-home"
url  = "https://github.com/MoSunDay/any-home.git"
sha  = "42b8d8ea9bdab14c55a1a924654b709055dd2ee3"

[[repo]]
name = "nfsserve"
url  = "https://github.com/huggingface/nfsserve.git"
sha  = "c00c3614184bc79010c0aa3b69c2cdde1c5fca77"
patch = "scripts/patches/nfsserve-auth-identity.patch"
patch_marker = "src/identity.rs"
# any-home's workspace resolves nfsserve at link_repos/nfsserve relative
# to the any-home root; keep that path a relative symlink to the main
# target so only ONE nfsserve copy exists in the dependency graph (Q38).
also_link = ["link_repos/any-home/link_repos/nfsserve"]

[[repo]]
name = "libsql"
url  = "https://github.com/tursodatabase/libsql.git"
sha  = "6f451a1fabacbcbc9960b232b4c1605a5021979b"
path = "link_repos/any-home/link_repos/libsql"

[[repo]]
name = "arust-workflow"
url  = "https://github.com/MoSunDay/arust-workflow.git"
sha  = "687ed3257b47240ac3564ebbef0b6181490708b3"
