# link_repos.lock — pinned path-dependency manifest (T0.2b, Q38).
#
# `link_repos/` is gitignored BY DESIGN: these are read-only build inputs,
# materialized reproducibly by `scripts/bootstrap-link-repos.sh`
# (git clone + `git checkout <sha>`). Never commit materialized trees.
#
# Rules:
#   * Entries materialize IN LISTED ORDER — any-home precedes its nested
#     link_repos/* children (nfsserve, libsql), and nfsserve's patch
#     canonical copy lives INSIDE the any-home pin so patch and consumer
#     always move together.
#   * `path` is repo-root relative; default `link_repos/<name>`.
#   * `patch` (optional) is applied on top of the pinned checkout,
#     idempotently (`patch_marker` file presence = already applied).
#     nfsserve carries the anyhome AUTH_SYS caller-identity patch (Q37).
#   * The real directories link_repos/argo-workflows/ and link_repos/flannel/
#     are REFERENCE CHECKOUTS ONLY (docs / e2e inspiration) — no Cargo.toml
#     path dependency points at them; bootstrap ignores them.
#   * Reachability notes: all MoSunDay/* pins except rdb are origin/main
#     tips. rdb's validated line (8de5dcc) was rewritten out of upstream
#     main (d52ef49 is a parallel rebase), so the pin is published as the
#     dedicated branch `pin/init-pro` on MoSunDay/rdb — full clone +
#     checkout reaches it. libsql/nfsserve pins are ancestors of (resp.
#     tip of) their public upstreams.

