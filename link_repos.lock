# link_repos.lock — pinned path-dependency manifest (T0.2b, Q38; Q66
# revision: any-home + libsql pins decommissioned, 6 pins remain).
#
# `link_repos/` is gitignored BY DESIGN: these are read-only build inputs,
# materialized reproducibly by `scripts/bootstrap-link-repos.sh`
# (git clone + `git checkout <sha>`). Never commit materialized trees.
#
# Rules:
#   * Entries materialize IN LISTED ORDER. nfsserve is pinned TOP-LEVEL
#     (default path link_repos/nfsserve); its AUTH_SYS caller-identity
#     patch (Q37) is versioned in THIS repo at scripts/patches/ so the
#     patch advances with its consumer commit-by-commit (Q66: the pin no
#     longer rides inside an any-home tree).
#   * `path` is repo-root relative; default `link_repos/<name>`.
#   * `patch` (optional) is applied on top of the pinned checkout,
#     idempotently (`patch_marker` file presence = already applied).
#   * `also_link` (optional, string array) lists extra repo-root paths that
#     must resolve to this repo's MAIN target as RELATIVE symlinks — a
#     generic capability for upstream workspaces that reference a pin
#     through their own internal relative path. Currently unused: no pin
#     carries an also_link (the only consumer, the nested any-home layout,
#     died with Q66); the mechanism stays in the bootstrap script.
#   * The real directories link_repos/argo-workflows/, link_repos/flannel/
#     and link_repos/kiri/ are REFERENCE CHECKOUTS ONLY (docs / e2e
#     inspiration) — no Cargo.toml path dependency points at them;
#     bootstrap ignores them. kiri @ 7846fe0 is the Apache-2.0 source of
#     the nsrun clone3/namespace port (T4.11, Q48); only
#     crates/kiri-init/src/linux/ is referenced — the GPL-2.0 guest/kernel
#     tree is never touched (see NOTICE).
#   * Reachability notes: all MoSunDay/* pins except rdb are origin/main
#     tips. rdb's validated line (8de5dcc) was rewritten out of upstream
#     main (d52ef49 is a parallel rebase), so the pin is published as the
#     dedicated branch `pin/init-pro` on MoSunDay/rdb — full clone +
#     checkout reaches it. nfsserve is the tip of its public upstream.
#     Cold clones materialize 6 mandatory pins: openrusty, rdb,
#     flannel-rust, opencoder, nfsserve, arust-workflow (Q66; the former
#     any-home + libsql pair is decommissioned). arust-workflow (Q42) is
#     the workflow engine+model extraction — origin/main tip, consumed as
#     workspace path deps by crates/api and crates/controllers.

