[package]
name = "router"
description = "Built-in Router VM: mlua-driven HTTP data plane (T5.1 bridge + T5.2 phase pipeline + T5.4 ingress routing/proxy + TLS + hot reload)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
mlua = { workspace = true }
tokio = { workspace = true }
http = "1"
bytes = "1"
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
getrandom = "0.4"
# Layer 5 T5.4: Ingress -> route-table compilation uses the networking/v1 types.
k8s-openapi = { workspace = true }
# T5.4 Scope B: TLS termination (server SNI) + cosocket TLS (client).
# `ring` crypto provider (Q16): smaller, widely audited; no aws-lc-rs FIPS path.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
# T5.3 Scope B: resty.http client verify=true path uses the Mozilla root store.
webpki-roots = "0.26"

[dev-dependencies]
tokio = { workspace = true }
# Test-only self-signed certificate generation (T5.4 Scope B TLS gate). Never
# shipped in the release binary — dev-dependency only. No private keys are
# committed: certs are freshly generated per test run (R5).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
