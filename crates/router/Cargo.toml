[package]
name = "router"
description = "Built-in Router data plane: openrusty-powered h2c gateway (T5.x rewrite, decision Q32) — NodePort service plane + Ingress gateway, Q28 behavior parity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Q32: the gateway engine. Config/state assembly + route compilation live in
# this crate; openrusty serves the actual HTTP/1.1 + h2c connections.
openrusty-core = { workspace = true }
openrusty-server = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
# Serve loop: hyper-util's auto builder (own accept loop — openrusty's h2c
# helper binds fixed addresses and needs a concrete `SocketAddr`; we need
# `:0` ephemeral binds + a 503 gate per listener).
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio = { workspace = true }
tracing = { workspace = true }
# Sprint 18 / S4 (Q28): the NodePort service plane — live Endpoints/Services
# reflectors over the storage backend + per-nodePort reverse-proxy listeners.
infra = { workspace = true }
storage = { workspace = true }
serde_json = { workspace = true }
# Q32: Ingress/IngressClass come from the in-tree `api` networking model
# (replaces the Lua-era k8s-openapi networking types).
api = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Unit tests construct ObjectMeta for the api networking types (runtime code
# stays free of kube-core; Q32 keeps the data plane lean).
kube-core = { workspace = true }
