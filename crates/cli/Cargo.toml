# T4.12 (Q51): the agent's built-in-engine boot probe speaks the engine
# wire protocol (connect + ping + shutdown) to a throwaway probe socket.
engine-client = { workspace = true }
# Sprint 18 / S4 (Q28): the built-in Router's NodePort service plane carries
# Service traffic by default (--disable-kube-proxy turns it off).
router = { workspace = true }
# T6.3 (Q40): the embedded Docker Registry HTTP API v2 image plane rides the
# `server` process (the anyhome doctrine: embedded + default-on).
registry = { workspace = true }
k8s-openapi = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# T4.3 Scope A (Q34): CancellationToken bridging infra::Shutdown onto the
# embedded flanneld (flanneld::run takes a tokio_util token, not Shutdown).
tokio-util = "0.7"
# T4.3 Scope A (Q34): net-conf.json rendering for the embedded flanneld.
serde_json = { workspace = true }
tracing = { workspace = true }
sha2.workspace = true
zstd.workspace = true
# T-anyhome (Q66): the workspace NFSv3 plane's engine — nfsserve is the
# top-level pin (link_repos/nfsserve, AUTH_SYS patch Q37) behind DirFs.
nfsserve = { workspace = true }
# T-anyhome (Q66): SymbolTable for the mirrorfs-derived VFS port
# (anyhome_vfs); inside nfsserve intaglio is only an optional demo feature.
intaglio = "1.6"
# T-anyhome (Q66): the `#[async_trait]` NFSFileSystem impl of DirFs.
async-trait = { workspace = true }
