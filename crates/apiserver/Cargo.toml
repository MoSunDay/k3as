[package]
name = "apiserver"
description = "Kubernetes API server HTTP layer: byte-correct discovery + REST CRUD/watch over a StorageBackend (T1.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
api = { workspace = true }
common = { workspace = true }
storage = { workspace = true }
axum = { workspace = true }
# T1.3a (Q47): serving-side TLS -- self-signed CA + serving cert (rcgen,
# ring backend, matches the rustls 0.23 stack already in the lock via openrusty)
# and the tokio-rustls acceptor branch.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# Single rustls stack for the control plane (Q47 LOCKED): rustls direct dep,
# NOT routed through openrusty.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
getrandom = "0.4"
k8s-openapi = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# `util` feature provides `ServiceExt::oneshot` for the in-process transport.
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { workspace = true }
