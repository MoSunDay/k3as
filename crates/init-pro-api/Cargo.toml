[package]
name = "init-pro-api"
description = "Kubernetes-faithful resource model, schema registry, and init-pro.io API groups (TODO T1.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Wire-compatible k8s resource types. JSON-only for v1 (decision Q10): we use
# k8s-openapi's serde types + kube-core's GVK/GVR/ObjectMeta machinery, but
# never its protobuf codec.
kube-core = { workspace = true }
k8s-openapi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
json-patch = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
