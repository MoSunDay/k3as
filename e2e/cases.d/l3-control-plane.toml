# Layer 3 -- control plane (T3.1-T3.2): controllers, scheduler, workloads,
# namespace cascade. T3.3/T3.4 are not-started (no suites yet).

[[suite]]
id = "golden:controllers"
script = "scripts/golden/suites/controllers.sh"
runner = "golden"
layer = 3
todos = ["T3.1"]
cases = ["G16", "G17", "G18", "G19", "G20", "G21"]
